<!DOCTYPE html>
<html>
<head>
    <title>deeplizard predict image app</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
    integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
</head>
<body>
    <main>
        <div class="container mt-5">
            <div class="row">
                <div class="col-12">
                    <div class="progress progress-bar progress-bar-striped progress-bar-animated mb-2">Loading Model</div>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <input id="image-selector" class="form-control border 0" type="file">
                </div>
                <div class="col-6">
                    <button id="predict-button" class="btn btn-dark float-right">Predict</button>
                </div>
            </div>
            <hr>
            <div class="row">
                <div class="col">
                    <div class="col">
                        <h2 class="ml-3">Predictions</h2>
                        <ol id="predictions-list"></ol>
                    </div>
                </div>
            <hr>
            <div class="row">
                <div class="col-12">
                    <h2 class="ml-3">Image</h2>
                    <img id="selected-image" class="ml-3" src="" />
                </div>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="imagenet_classes.js"></script>
    <script src="predict.js"></script>
    <script>
        async function loadAndPredict() {
            const imageSelector = document.getElementById('image-selector');
            const selectedImage = document.getElementById('selected-image');
            const predictionsList = document.getElementById('predictions-list');
            const predictButton = document.getElementById('predict-button');

            // Load the MobileNet model
            const model = await mobilenet.load();

            // Add event listener to the predict button
            predictButton.addEventListener('click', async () => {
                const file = imageSelector.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async function(event) {
                    selectedImage.src = event.target.result;
                    const predictions = await model.classify(selectedImage);
                    predictionsList.innerHTML = predictions.map(p => `<li>${p.className}: ${p.probability.toFixed(2)}</li>`).join('');
                };
                reader.readAsDataURL(file);
            });
        }

        loadAndPredict();
    </script>
</body>
</html>
